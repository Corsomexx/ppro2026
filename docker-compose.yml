services:
  db:
    image: postgres:16-alpine
    container_name: rental_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password123
      POSTGRES_DB: rental_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental_user -d rental_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: rental_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rental_user:rental_password123@db:5432/rental_db
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
